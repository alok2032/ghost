name: AYRA Enterprise Security CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  secret-scan:
    name: Secret & Hardcoded Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source tree for leaked API keys or private keys
        run: |
          if grep -rnEI "(AIza[0-9A-Za-z\-_]{28,}|sk-proj-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{25,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.gradle --exclude-dir=.build-outputs \
            --exclude="*Test.kt" --exclude="*.test.mjs" --exclude="*.example" --exclude="google-services.json" --exclude="*.apk" .; then
            echo "ERROR: Potential secret detected in repository!"
            exit 1
          fi

  android-security-tests:
    name: Android Build & Security Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Reject retired Firebase project IDs in app resources and backend config
        run: |
          if grep -rnE "gen-lang-client-0595455617|gen-lang-client-0643978985" \
            README.md RELEASE_SIGNING.md DEPLOYMENT_AND_RISK_REPORT.md \
            app/google-services.json app/src/main/res/ \
            backend/src/server.ts backend/src/app.ts .env.example; then
            echo "ERROR: Retired Firebase project ID detected in active config or docs!"
            exit 1
          fi
      - name: Run Android Debug Unit & Security Regression Tests
        run: ./gradlew :app:testDebugUnitTest --max-workers=2 --console=plain
      - name: Verify fail-closed production signing gate
        run: |
          if ./gradlew :app:validateProductionReleaseSigning -PayraRequireProductionSigning=true --console=plain; then
            echo "ERROR: validateProductionReleaseSigning must fail when debug keystore is used under production flag!"
            exit 1
          fi
      - name: Assemble Debug & R8 Release APKs and Verify Signing Metadata
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:verifyReleaseSigningCertificate --max-workers=2 --console=plain

  backend-zero-trust-tests:
    name: Zero-Trust Node/TS Backend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install, Typecheck & Run Security Tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

  firestore-rules-tests:
    name: Firestore Security Rules Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root test dependencies & Firebase CLI
        run: |
          npm ci --no-audit --no-fund
          npm install -g firebase-tools
      - name: Run Firestore emulator security rule tests
        run: firebase emulators:exec --project demo-no-project --only firestore "npm run test:firestore"
