name: Model Health & Drift Monitor

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  model-health:
    name: Verify ModelCatalog Against Dead List & Live APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dead-models.txt and probe configured live provider catalogs
        id: drift
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node <<'EOF'
          import fs from "node:fs";

          const deadLines = fs.readFileSync("config/dead-models.txt", "utf8")
            .split("\n")
            .map((l) => l.trim())
            .filter((l) => l && !l.startsWith("#"))
            .map((p) => new RegExp(p));

          const catalogSrc = fs.readFileSync("app/src/main/java/com/ayra/ai/app/ai/providers/ModelCatalog.kt", "utf8");
          const providersSrc = fs.readFileSync("app/src/main/java/com/ayra/ai/app/ai/providers/ExternalAiProviders.kt", "utf8");

          const literals = new Set();
          for (const m of (catalogSrc + "\n" + providersSrc).matchAll(/"([a-zA-Z0-9._:/-]+)"/g)) {
            literals.add(m[1]);
          }

          const deadHits = [];
          for (const id of literals) {
            if (deadLines.some((re) => re.test(id))) {
              deadHits.push(id);
            }
          }

          const liveFindings = [];
          async function checkOpenAiCompat(name, url, key) {
            if (!key) return;
            try {
              const res = await fetch(url, { headers: { Authorization: `Bearer ${key}` } });
              if (!res.ok) {
                liveFindings.push(`${name}: /models returned HTTP ${res.status}`);
                return;
              }
              const body = await res.json();
              const available = new Set((body.data || []).map((x) => x.id));
              const sampleCheck = name === "OpenAI" ? ["gpt-4o", "gpt-4o-mini"] : name === "Groq" ? ["llama-3.3-70b-versatile"] : [];
              for (const expected of sampleCheck) {
                if (!available.has(expected)) {
                  liveFindings.push(`${name}: baseline model '${expected}' missing from live /models`);
                }
              }
            } catch (err) {
              liveFindings.push(`${name}: probe failed (${err.message})`);
            }
          }

          await checkOpenAiCompat("OpenAI", "https://api.openai.com/v1/models", process.env.OPENAI_API_KEY);
          await checkOpenAiCompat("Groq", "https://api.groq.com/openai/v1/models", process.env.GROQ_API_KEY);
          await checkOpenAiCompat("OpenRouter", "https://openrouter.ai/api/v1/models", process.env.OPENROUTER_API_KEY);

          const hasDrift = deadHits.length > 0 || liveFindings.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_drift=${hasDrift}\n`);
          const report = [
            `Dead model hits in catalog: ${deadHits.length ? deadHits.join(", ") : "none"}`,
            `Live /models drift findings: ${liveFindings.length ? liveFindings.join("; ") : "none (or no provider API secrets configured)"}`
          ].join("\n");
          fs.writeFileSync("/tmp/model_drift_report.txt", report);
          console.log(report);
          EOF

      - name: Open or update Model drift issue on detection
        if: steps.drift.outputs.has_drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/model_drift_report.txt", "utf8");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50
            });
            const existing = issues.find((i) => i.title === "Model drift");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nightly model-health check flagged drift:\n\n\`\`\`\n${body}\n\`\`\``
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Model drift",
                body: `Nightly model-health check flagged drift:\n\n\`\`\`\n${body}\n\`\`\``
              });
            }
